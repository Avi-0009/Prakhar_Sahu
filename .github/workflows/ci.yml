name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Day4/piece2/QuotesApi.Tests.Integration/QuotesApi.Tests.Integration.csproj

    - name: Build
      run: dotnet build Day4/piece2/QuotesApi.Tests.Integration/QuotesApi.Tests.Integration.csproj --no-restore

    - name: Test and Collect Coverage
      run: dotnet test Day4/piece2/QuotesApi.Tests.Integration/QuotesApi.Tests.Integration.csproj --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --settings Day4/piece2/coverlet.runsettings --results-directory ./TestResults

    - name: Enforce Code Coverage Threshold (Fail < 70%)
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: TestResults/**/coverage.cobertura.xml
        badge: true
        fail_below_min: true
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '70 80'

    - name: Upload Test Results Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults/**/*.trx

    - name: Upload Code Coverage Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage
        path: TestResults/**/coverage.cobertura.xml
